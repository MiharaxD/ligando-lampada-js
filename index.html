<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
    <title>Lâmpada</title>
</head>

<body>
    <header>
        <h1><img src="assets/header-titulo.png" alt="Controlando uma Lâmpada com JS" class="titulo"></h1>
    </header>
    <main>
        <img src="assets/lampada-apagada.png" alt="lampada" class="lamp" id="lamp">
        <input type="checkbox" name="btn" id="btn">
        <label for="btn"><img src="assets/switch-off.png" id="label" alt="botao"></label>
    </main>
    <footer>
        <p><img src="assets/footer-titulo.png" alt=""></p>
    </footer>
</body>

</html>
